server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: none
        secure: true

spring:
  datasource:
    url: jdbc:h2:file:./data/app;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs/java/v3/api-docs
  swagger-ui:
    path: /api-docs/java/swagger-ui.html
    disable-swagger-default-url: true
    with-credentials: true
    display-request-duration: true
    tags-sorter: alpha
    operations-sorter: method
  paths-to-exclude:
    - /api/admin/**
  show-actuator: false

app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173,http://localhost:8090}
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
