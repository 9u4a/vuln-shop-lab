server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # 리다이렉트 Location을 상대 경로로 — 포트(:8090)가 빠진 절대 URL 생성 방지
    absolute_redirect off;

    # 압축 (정적 자산 · JSON 응답)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 백엔드가 느리거나 죽었을 때 60초씩 매달리지 않도록 타임아웃 단축
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 업스트림 장애 시 기본 나체 에러 페이지 대신 안내 페이지
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>일시적 오류</title><body style="font-family:sans-serif;padding:2rem"><h1>일시적으로 연결할 수 없어요</h1><p>백엔드가 준비 중이거나 응답하지 않습니다. 잠시 후 다시 시도해 주세요.</p></body>';
    }

    location /api/node/ {
        proxy_pass http://node-express:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/java/ {
        proxy_pass http://java-spring:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/node/ {
        proxy_pass http://node-express:3000/uploads/;
    }

    location /uploads/java/ {
        proxy_pass http://java-spring:8081/uploads/;
    }

    # OpenAPI 문서 진입점. proxy_pass에 URI 부분이 없어 경로가 그대로 백엔드로 전달된다
    # (Swagger UI가 내보내는 절대/상대 URL이 nginx 뒤에서도 그대로 맞아떨어지게 하기 위함).
    # X-Forwarded-Proto는 넘기지 않는다(문서 경로엔 불필요, https 절대 URL 오생성 방지).
    location = /api-docs {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>API 문서</title><body style="font-family:system-ui,sans-serif;padding:2rem;line-height:1.7"><h1>API 문서</h1><ul><li><a href="/api-docs/node/">node-express</a></li><li><a href="/api-docs/java/swagger-ui.html">java-spring</a></li></ul></body>';
    }
    location = /api-docs/ { return 301 /api-docs; }

    location = /api-docs/node { return 301 /api-docs/node/; }
    location /api-docs/node/ {
        proxy_pass http://node-express:3000;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api-docs/java  { return 302 /api-docs/java/swagger-ui.html; }
    location = /api-docs/java/ { return 302 /api-docs/java/swagger-ui.html; }
    location /api-docs/java/ {
        proxy_pass http://java-spring:8081;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 해시 파일명 정적 자산은 장기 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
