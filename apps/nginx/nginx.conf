server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/node/ {
        proxy_pass http://node-express:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/java/ {
        proxy_pass http://java-spring:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/node/ {
        proxy_pass http://node-express:3000/uploads/;
    }

    location /uploads/java/ {
        proxy_pass http://java-spring:8081/uploads/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
