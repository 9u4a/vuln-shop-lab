server {
    listen 80;
    server_name _;

    client_max_body_size 5m;

    root /usr/share/nginx/html;
    index index.html;

    # 압축 (정적 자산 · JSON 응답)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 백엔드가 느리거나 죽었을 때 60초씩 매달리지 않도록 타임아웃 단축
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # 업스트림 장애 시 기본 나체 에러 페이지 대신 안내 페이지
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>일시적 오류</title><body style="font-family:sans-serif;padding:2rem"><h1>일시적으로 연결할 수 없어요</h1><p>백엔드가 준비 중이거나 응답하지 않습니다. 잠시 후 다시 시도해 주세요.</p></body>';
    }

    location /api/node/ {
        proxy_pass http://node-express:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/java/ {
        proxy_pass http://java-spring:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /uploads/node/ {
        proxy_pass http://node-express:3000/uploads/;
    }

    location /uploads/java/ {
        proxy_pass http://java-spring:8081/uploads/;
    }

    # 해시 파일명 정적 자산은 장기 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
