services:
  node-express:
    build: ./apps/node-express
    container_name: vulnshop-node
    ports:
      - "3000:3000"
    environment:
      SESSION_SECRET: ${NODE_SESSION_SECRET:-dev-secret-change-me}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - mongo
    volumes:
      - node_data:/app/data
      - node_uploads:/app/uploads
    networks:
      - vulnshop-net

  mongo:
    image: mongo:7
    container_name: vulnshop-mongo
    volumes:
      - mongo_data:/data/db
    networks:
      - vulnshop-net

  java-spring:
    build: ./apps/java-spring
    container_name: vulnshop-java
    ports:
      - "8081:8081"
    environment:
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    volumes:
      - java_data:/app/data
      - java_uploads:/app/uploads
    networks:
      - vulnshop-net

  client:
    build: ./apps/client
    container_name: vulnshop-client
    ports:
      - "5173:5173"
    environment:
      NODE_BACKEND_URL: http://node-express:3000
      JAVA_BACKEND_URL: http://java-spring:8081
      VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    depends_on:
      - node-express
      - java-spring
    networks:
      - vulnshop-net

  nginx:
    build:
      context: .
      dockerfile: apps/nginx/Dockerfile
      args:
        VITE_TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
    container_name: vulnshop-nginx
    ports:
      - "8090:80"
    depends_on:
      - node-express
      - java-spring
    networks:
      - vulnshop-net

networks:
  vulnshop-net:
    driver: bridge

volumes:
  node_data:
  node_uploads:
  java_data:
  java_uploads:
  mongo_data:
